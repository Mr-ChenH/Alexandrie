name: Build and Publish Docker Images
run-name: Docker images · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/docker-image-release.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/docker-image-release.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch, tag or SHA to build (empty = current branch)"
        required: false
        type: string
      tag:
        description: "Optional additional image tag (for example: preview)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Validate production and development Compose files
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  build-and-push:
    needs: validate-compose
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true

      - name: Resolve image name and checked-out revision
        id: target
        env:
          COMPONENT: ${{ matrix.component }}
          CUSTOM_TAG: ${{ inputs.tag }}
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CUSTOM_TAG" && ! "$CUSTOM_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::The image tag must be a valid Docker tag (maximum 128 characters)."
            exit 1
          fi
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}"
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=12 HEAD)"
          } >> "$GITHUB_OUTPUT"
          publish_latest=false
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] ||
             [[ "$EVENT_NAME" == release && "$IS_PRERELEASE" != true ]] ||
             [[ "$EVENT_NAME" == workflow_dispatch && ( "${REQUESTED_REF:-$GITHUB_REF}" == main || "${REQUESTED_REF:-$GITHUB_REF}" == refs/heads/main ) ]]; then
            publish_latest=true
          fi
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for ARM64 builds
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.target.outputs.publish_latest == 'true' }}
            type=raw,value=sha-${{ steps.target.outputs.short_sha }}
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Alexandrie ${{ matrix.component }}
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
