name: Frontend Linters

on:
  pull_request:
    paths:
      - "frontend/**"

jobs:
  lint:
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test PDF pagination and container runtime configuration
        run: |
          bun test app/helpers/
          node --test docker-runtime-config.test.mjs

      - name: Run ESLint
        run: bun run lint

      - name: Run Stylelint (CSS)
        run: bun run lint:css

      - name: Run Typecheck
        run: bun run typecheck

      - name: Build and verify production runtime configuration
        run: |
          bun run build
          node scripts/check-docker-runtime.mjs
